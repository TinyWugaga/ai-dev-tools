# surface 清單（ADR-0001、ADR-0004）。
# channel：copy（deploy 複製到 targets）| manual（手動貼上）| in-repo（repo 內實體檔，不需 deploy）| none（無載入管道）
# model：日常使用的 model，eval runner 以此指定 model（ADR-0003 §6）。未填時 lint 會警告。
# limit.unit：chars | bytes | lines | unknown | none；enforce：error（預設）| warn

- id: claude-ai
  kind: chat
  scope: global
  channel: manual
  files: [surfaces/claude-ai/preferences.md]
  model: Opus 5.5
  limit:
    value: null
    unit: unknown
    source: 無官方數字
    checked: 2026-10-04
  notes: >-
    除了 claude.ai 對話，Claude Code cloud session 也會載入（2026-10-09 本 repo 的 cloud session 觀察到）。
    本機 Claude Code CLI 回報的載入清單中沒有它（2026-10-09 CLI 自述，未以 canary 驗證）。

- id: claude-code-global
  kind: agentic
  scope: global
  channel: copy
  files: [surfaces/claude-code/CLAUDE.md]
  targets: [~/.claude/CLAUDE.md]
  model: Opus 5.5
  limit:
    value: 200
    unit: lines
    enforce: warn
    source: https://code.claude.com/docs/en/memory （官方建議值，非硬上限）
    checked: 2026-10-04
  notes: 超過 200 行，或出現只適用於特定檔案類型的 intent 時，拆分到 ~/.claude/rules/（ADR-0004 §6）。

- id: claude-code-repo
  kind: agentic
  scope: repo
  channel: in-repo
  files: [CLAUDE.md]
  model: Opus 5.5
  limit:
    value: 200
    unit: lines
    enforce: warn
    source: https://code.claude.com/docs/en/memory （官方建議值，非硬上限）
    checked: 2026-10-04

- id: chatgpt
  kind: chat
  scope: global
  channel: none
  notes: >-
    與 ~/.codex/AGENTS.md 雙向同步（2026-10-09 使用者實測），內容由 codex-global 維護與部署。
    傾向不套用到 Codex cloud 任務（docs/spikes/S2-result.md）。

- id: codex-global
  kind: agentic
  scope: global
  channel: copy
  files: [surfaces/codex/AGENTS.md]
  targets: [~/.codex/AGENTS.md]
  model: GPT-6.1 Sol
  limit:
    value: 5000
    unit: chars
    source: >-
      https://help.openai.com/en/articles/8096356-chatgpt-custom-instructions （Plus 方案）。
      本檔與 ChatGPT Custom Instructions 雙向同步，所以套用 ChatGPT 的上限；Codex 本身沒有 global 上限（C4）。
      超過上限時同步會怎麼處理，尚未驗證。
    checked: 2026-10-09
  notes: >-
    與 ChatGPT Custom Instructions 雙向同步（2026-10-09 使用者實測），ChatGPT 對話也會讀到本檔，
    所以不能放只對 agent 有意義的規則。
    在 Codex CLI 與 app 的 local project 生效，不適用於 Codex cloud（C6）。
    非空的 ~/.codex/AGENTS.override.md 會讓本檔整份失效（C1）。
    Codex app 的 Personalization 會直接改寫本檔（C7）。

- id: codex-repo
  kind: agentic
  scope: repo
  channel: in-repo
  files: [AGENTS.md]
  model: GPT-6.1 Sol
  limit:
    value: 32768
    unit: bytes
    source: docs/spikes/codex-verification-result.md#c4-大小上限 （project_doc_max_bytes 預設值；超過時最後一個檔會被靜默截斷）
    checked: 2026-10-04

- id: codex-cloud
  kind: agentic
  scope: repo
  channel: none
  notes: >-
    一般 cloud 任務的 cwd 不在 repo 內，不會載入 repo 的 AGENTS.md；Custom Instructions 傾向不套用（S2）。
    第一次用 Codex cloud 跑本 repo 時補測 S2 未解項目，找到載入管道就改 channel。
